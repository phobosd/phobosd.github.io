<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad Stopwatch Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            user-select: none;
            margin: 0;
            padding: 4px; /* Small outer gutter */
        }
        .stopwatch-card {
            border: 1px solid #222;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
        }
        .timer-display {
            font-family: monospace;
            font-variant-numeric: tabular-nums;
            /* Precise sizing for 480px height (approx 230px per row) */
            line-height: 1;
        }
        .btn-red {
            background-color: #b91c1c;
            transition: background-color 0.1s ease;
        }
        .btn-red:active {
            background-color: #ef4444;
        }
        .btn-gray {
            background-color: #262626;
        }
        .btn-gray:active {
            background-color: #404040;
        }
    </style>
</head>
<body class="flex items-stretch">

    <!-- Quad Grid Layout optimized for 800x480 -->
    <div class="grid grid-cols-2 grid-rows-2 gap-2 w-full h-full">
        
        <!-- Stopwatch 1 -->
        <div id="sw-1" class="stopwatch-card rounded-lg">
            <div class="text-[10px] uppercase tracking-widest text-gray-500">Timer One</div>
            <div id="display-1" class="timer-display text-5xl font-bold">00:00:00.0</div>
            <div class="flex gap-2 w-full h-[45%]">
                <button onclick="toggleTimer(1)" id="btn-start-1" class="btn-red flex-1 text-xl font-bold rounded-xl">START</button>
                <button onclick="resetTimer(1)" class="btn-gray flex-1 text-xl font-bold rounded-xl">RESET</button>
            </div>
        </div>

        <!-- Stopwatch 2 -->
        <div id="sw-2" class="stopwatch-card rounded-lg">
            <div class="text-[10px] uppercase tracking-widest text-gray-500">Timer Two</div>
            <div id="display-2" class="timer-display text-5xl font-bold">00:00:00.0</div>
            <div class="flex gap-2 w-full h-[45%]">
                <button onclick="toggleTimer(2)" id="btn-start-2" class="btn-red flex-1 text-xl font-bold rounded-xl">START</button>
                <button onclick="resetTimer(2)" class="btn-gray flex-1 text-xl font-bold rounded-xl">RESET</button>
            </div>
        </div>

        <!-- Stopwatch 3 -->
        <div id="sw-3" class="stopwatch-card rounded-lg">
            <div class="text-[10px] uppercase tracking-widest text-gray-500">Timer Three</div>
            <div id="display-3" class="timer-display text-5xl font-bold">00:00:00.0</div>
            <div class="flex gap-2 w-full h-[45%]">
                <button onclick="toggleTimer(3)" id="btn-start-3" class="btn-red flex-1 text-xl font-bold rounded-xl">START</button>
                <button onclick="resetTimer(3)" class="btn-gray flex-1 text-xl font-bold rounded-xl">RESET</button>
            </div>
        </div>

        <!-- Stopwatch 4 -->
        <div id="sw-4" class="stopwatch-card rounded-lg">
            <div class="text-[10px] uppercase tracking-widest text-gray-500">Timer Four</div>
            <div id="display-4" class="timer-display text-5xl font-bold">00:00:00.0</div>
            <div class="flex gap-2 w-full h-[45%]">
                <button onclick="toggleTimer(4)" id="btn-start-4" class="btn-red flex-1 text-xl font-bold rounded-xl">START</button>
                <button onclick="resetTimer(4)" class="btn-gray flex-1 text-xl font-bold rounded-xl">RESET</button>
            </div>
        </div>

    </div>

    <script>
        const timers = {
            1: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false },
            2: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false },
            3: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false },
            4: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false }
        };

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            let deciseconds = Math.floor((ms % 1000) / 100);

            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${deciseconds}`;
        }

        function updateDisplay(id) {
            const display = document.getElementById(`display-${id}`);
            display.textContent = formatTime(timers[id].elapsedTime);
        }

        function toggleTimer(id) {
            const t = timers[id];
            const btn = document.getElementById(`btn-start-${id}`);

            if (!t.running) {
                t.startTime = Date.now() - t.elapsedTime;
                t.timerInterval = setInterval(() => {
                    t.elapsedTime = Date.now() - t.startTime;
                    updateDisplay(id);
                }, 100);
                t.running = true;
                btn.textContent = "STOP";
                btn.style.backgroundColor = "#ffffff";
                btn.style.color = "#000000";
            } else {
                clearInterval(t.timerInterval);
                t.running = false;
                btn.textContent = "START";
                btn.style.backgroundColor = ""; 
                btn.style.color = "";
            }
        }

        function resetTimer(id) {
            const t = timers[id];
            const btn = document.getElementById(`btn-start-${id}`);
            clearInterval(t.timerInterval);
            t.running = false;
            t.elapsedTime = 0;
            btn.textContent = "START";
            btn.style.backgroundColor = "";
            btn.style.color = "";
            updateDisplay(id);
        }

        window.addEventListener('load', () => {
            for(let i=1; i<=4; i++) updateDisplay(i);
        });
    </script>
</body>
</html>
