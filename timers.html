<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad Stopwatch Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling on the Pi display */
            height: 100vh;
            user-select: none; /* Prevent text selection during rapid tapping */
        }
        .stopwatch-card {
            border: 1px solid #333;
            background: #0a0a0a;
        }
        .timer-display {
            font-family: monospace;
            font-variant-numeric: tabular-nums;
        }
        /* Custom Red Button Styling */
        .btn-red {
            background-color: #b91c1c; /* red-700 */
            transition: background-color 0.1s ease, transform 0.05s ease;
        }
        .btn-red:active {
            background-color: #ef4444; /* red-500 */
            transform: scale(0.98);
        }
        .btn-gray {
            background-color: #374151; /* gray-700 */
        }
        .btn-gray:active {
            background-color: #4b5563; /* gray-600 */
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex flex-col p-2 gap-2">

    <!-- Quad Grid Layout -->
    <div class="grid grid-cols-2 grid-rows-2 gap-2 h-full w-full">
        
        <!-- Stopwatch 1 -->
        <div id="sw-1" class="stopwatch-card rounded-xl flex flex-col items-center justify-center p-4">
            <div class="text-sm uppercase tracking-widest text-gray-500 mb-1">Timer One</div>
            <div id="display-1" class="timer-display text-5xl md:text-7xl font-bold mb-4">00:00:00.0</div>
            <div class="flex gap-4 w-full h-1/3">
                <button onclick="toggleTimer(1)" id="btn-start-1" class="btn-red flex-1 text-2xl font-bold rounded-2xl">START</button>
                <button onclick="resetTimer(1)" class="btn-gray flex-1 text-2xl font-bold rounded-2xl">RESET</button>
            </div>
        </div>

        <!-- Stopwatch 2 -->
        <div id="sw-2" class="stopwatch-card rounded-xl flex flex-col items-center justify-center p-4">
            <div class="text-sm uppercase tracking-widest text-gray-500 mb-1">Timer Two</div>
            <div id="display-2" class="timer-display text-5xl md:text-7xl font-bold mb-4">00:00:00.0</div>
            <div class="flex gap-4 w-full h-1/3">
                <button onclick="toggleTimer(2)" id="btn-start-2" class="btn-red flex-1 text-2xl font-bold rounded-2xl">START</button>
                <button onclick="resetTimer(2)" class="btn-gray flex-1 text-2xl font-bold rounded-2xl">RESET</button>
            </div>
        </div>

        <!-- Stopwatch 3 -->
        <div id="sw-3" class="stopwatch-card rounded-xl flex flex-col items-center justify-center p-4">
            <div class="text-sm uppercase tracking-widest text-gray-500 mb-1">Timer Three</div>
            <div id="display-3" class="timer-display text-5xl md:text-7xl font-bold mb-4">00:00:00.0</div>
            <div class="flex gap-4 w-full h-1/3">
                <button onclick="toggleTimer(3)" id="btn-start-3" class="btn-red flex-1 text-2xl font-bold rounded-2xl">START</button>
                <button onclick="resetTimer(3)" class="btn-gray flex-1 text-2xl font-bold rounded-2xl">RESET</button>
            </div>
        </div>

        <!-- Stopwatch 4 -->
        <div id="sw-4" class="stopwatch-card rounded-xl flex flex-col items-center justify-center p-4">
            <div class="text-sm uppercase tracking-widest text-gray-500 mb-1">Timer Four</div>
            <div id="display-4" class="timer-display text-5xl md:text-7xl font-bold mb-4">00:00:00.0</div>
            <div class="flex gap-4 w-full h-1/3">
                <button onclick="toggleTimer(4)" id="btn-start-4" class="btn-red flex-1 text-2xl font-bold rounded-2xl">START</button>
                <button onclick="resetTimer(4)" class="btn-gray flex-1 text-2xl font-bold rounded-2xl">RESET</button>
            </div>
        </div>

    </div>

    <script>
        // State management for 4 stopwatches
        const timers = {
            1: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false },
            2: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false },
            3: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false },
            4: { startTime: 0, elapsedTime: 0, timerInterval: null, running: false }
        };

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            let deciseconds = Math.floor((ms % 1000) / 100);

            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${deciseconds}`;
        }

        function updateDisplay(id) {
            const display = document.getElementById(`display-${id}`);
            display.textContent = formatTime(timers[id].elapsedTime);
        }

        function toggleTimer(id) {
            const t = timers[id];
            const btn = document.getElementById(`btn-start-${id}`);

            if (!t.running) {
                // Start
                t.startTime = Date.now() - t.elapsedTime;
                t.timerInterval = setInterval(() => {
                    t.elapsedTime = Date.now() - t.startTime;
                    updateDisplay(id);
                }, 100); // Update every 100ms for decisecond accuracy
                t.running = true;
                btn.textContent = "STOP";
                btn.classList.add('bg-white', 'text-black');
                btn.classList.remove('btn-red');
            } else {
                // Stop
                clearInterval(t.timerInterval);
                t.running = false;
                btn.textContent = "START";
                btn.classList.remove('bg-white', 'text-black');
                btn.classList.add('btn-red');
            }
        }

        function resetTimer(id) {
            const t = timers[id];
            const btn = document.getElementById(`btn-start-${id}`);
            
            clearInterval(t.timerInterval);
            t.running = false;
            t.elapsedTime = 0;
            t.startTime = 0;
            
            btn.textContent = "START";
            btn.classList.remove('bg-white', 'text-black');
            btn.classList.add('btn-red');
            
            updateDisplay(id);
        }

        // Handle simple touch prevention and viewport adjustments
        window.addEventListener('load', () => {
            // Force redraw on load
            for(let i=1; i<=4; i++) updateDisplay(i);
        });
    </script>
</body>
</html>
