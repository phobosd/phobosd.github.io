<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Space Shooter</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; background:#111; }
  #info {
      position:absolute;
      top:10px; left:10px;
      color:white; font-family:sans-serif;
      z-index:1;
  }
</style>
</head>
<body>

<div id="info">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
<canvas id="gameCanvas"></canvas>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');

  // Fullscreen canvas
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- Game State ---------- */
  let score = 0, lives = 3, gameOver = false;

  const player = { x: canvas.width/2, y: canvas.height-50, w:40, h:20,
                   speed:5, color:'#0f0', bullets:[] };

  const enemies = [];
  const enemySpeedBase = 1;
  const spawnInterval = 2000; // ms
  let lastSpawn = Date.now();

  /* ---------- Input ---------- */
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key] = true; });
  window.addEventListener('keyup',   e => { keys[e.key] = false; });

  /* ---------- Utility ---------- */
  function rectIntersect(r1, r2) {
    return !(r2.x > r1.x+r1.w || 
             r2.x+r2.w < r1.x ||
             r2.y > r1.y+r1.h ||
             r2.y+r2.h < r1.y);
  }

  /* ---------- Game Loop ---------- */
  function update() {
    if (gameOver) return;

    // Move player
    if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
    // Keep inside canvas
    player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));

    // Fire bullets
    if ((keys[' ']) && !player.firing) {  // space bar
      player.bullets.push({ x: player.x+player.w/2-2.5,
                            y: player.y,
                            w:5, h:10,
                            speed:7 });
      player.firing = true;
    }
    if (!keys[' ']) player.firing = false;

    // Update bullets
    player.bullets.forEach(b => b.y -= b.speed);
    player.bullets = player.bullets.filter(b => b.y > -b.h);

    // Spawn enemies
    const now = Date.now();
    if (now - lastSpawn > spawnInterval) {
      const w = 30, h = 20;
      const x = Math.random() * (canvas.width - w);
      enemies.push({ x, y:-h, w, h,
                     speed: enemySpeedBase + Math.random()*2 });
      lastSpawn = now;
    }

    // Update enemies
    enemies.forEach(e => e.y += e.speed);

    // Collision detection
    enemies.forEach((e,i) => {
      // Enemy hits player
      if (rectIntersect(e, player)) {
        lives--;
        if (lives <= 0) gameOver = true;
        enemies.splice(i,1);
        return;
      }
      // Bullets hit enemy
      player.bullets.forEach((b,j) => {
        if (rectIntersect(b, e)) {
          score += 10;
          enemies.splice(i,1);
          player.bullets.splice(j,1);
        }
      });
    });

    // Remove off‑screen enemies
    for(let i=enemies.length-1;i>=0;i--)
      if(enemies[i].y > canvas.height) enemies.splice(i,1);

    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw player
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Draw bullets
    ctx.fillStyle = '#ff0';
    player.bullets.forEach(b => ctx.fillRect(b.x,b.y,b.w,b.h));

    // Draw enemies
    ctx.fillStyle = '#f00';
    enemies.forEach(e => ctx.fillRect(e.x,e.y,e.w,e.h));

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '48px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2-20);
      ctx.font = '24px sans-serif';
      ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2+20);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
</body>
</html>
