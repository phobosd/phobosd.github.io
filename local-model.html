<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Shooter v2</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; background:#111; }
  #info {
      position:absolute;
      top:10px; left:10px;
      color:white; font-family:sans-serif;
      z-index:1;
  }
</style>
</head>
<body>

<div id="info">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
<canvas id="gameCanvas"></canvas>

<script>
(() => {
  /* ---------- Setup ---------- */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  /* ---------- Game State ---------- */
  let score = 0, lives = 3, gameOver = false;
  const player = { x:canvas.width/2, y:canvas.height-80,
                   w:30, h:40, speed:5, color:'#0f0',
                   bullets:[], firing:false };
  const enemies = [];           // asteroids
  const stars = [];             // star‑field

  /* ---------- Input ---------- */
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key] = true; });
  window.addEventListener('keyup',   e => { keys[e.key] = false; });

  /* ---------- Star Field ---------- */
  function initStars(n=200) {
    for(let i=0;i<n;i++){
      stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.5 + 0.2
      });
    }
  }
  initStars();

  /* ---------- Utility ---------- */
  function rectIntersect(r1,r2){
    return !(r2.x > r1.x+r1.w || 
             r2.x+r2.w < r1.x ||
             r2.y > r1.y+r1.h ||
             r2.y+r2.h < r1.y);
  }

  /* ---------- Game Loop ---------- */
  function update() {
    if(gameOver) return;

    /* --- Player movement --- */
    if(keys['ArrowLeft']||keys['a']) player.x -= player.speed;
    if(keys['ArrowRight']||keys['d']) player.x += player.speed;
    if(keys['ArrowUp']||keys['w']) player.y -= player.speed;
    if(keys['ArrowDown']||keys['s']) player.y += player.speed;

    // Keep inside canvas
    player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));
    player.y = Math.max(0, Math.min(canvas.height-player.h, player.y));

    /* --- Shooting --- */
    if((keys[' ']||keys['Shift']) && !player.firing){
      player.bullets.push({
        x: player.x + player.w/2 - 2.5,
        y: player.y,
        w:5, h:10,
        speed:7
      });
      player.firing = true;
    }
    if(!keys[' '] && !keys['Shift']) player.firing = false;

    /* --- Bullets --- */
    player.bullets.forEach(b => b.y -= b.speed);
    player.bullets = player.bullets.filter(b=>b.y>-b.h);

    /* --- Stars movement (scrolling background) --- */
    stars.forEach(s=>{
      s.y += s.speed;
      if(s.y>canvas.height){ s.y=-s.r; s.x=Math.random()*canvas.width;}
    });

    /* --- Asteroids spawn & update --- */
    const now = Date.now();
    if(now - (player.lastSpawn||0) > 1500){
      const w=30, h=20;
      enemies.push({
        x: Math.random()*(canvas.width-w),
        y:-h,
        w,h,
        speed: Math.random()*2 + 1.5
      });
      player.lastSpawn = now;
    }
    enemies.forEach(e=>e.y+=e.speed);

    /* --- Collision detection --- */
    enemies.forEach((e,i)=>{
      // hit by bullet
      player.bullets.forEach((b,j)=>{
        if(rectIntersect(b,e)){
          score += 10;
          enemies.splice(i,1);
          player.bullets.splice(j,1);
        }
      });
      // hits player
      if(rectIntersect(e,player)){
        lives--;
        if(lives<=0) gameOver=true;
        enemies.splice(i,1);
      }
    });

    // Remove off‑screen asteroids
    for(let i=enemies.length-1;i>=0;i--)
      if(enemies[i].y>canvas.height) enemies.splice(i,1);

    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }

  /* --- Drawing --- */
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw stars
    ctx.fillStyle='white';
    stars.forEach(s=>{ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();});

    /* --- Player (triangle spaceship) --- */
    ctx.save();
    ctx.translate(player.x+player.w/2, player.y+player.h/2);
    ctx.rotate(Math.PI/2); // point up
    ctx.beginPath();
    ctx.moveTo(0,-player.h/2);
    ctx.lineTo(-player.w/2, player.h/2);
    ctx.lineTo(player.w/2, player.h/2);
    ctx.closePath();
    ctx.fillStyle=player.color;
    ctx.fill();
    ctx.restore();

    /* --- Bullets --- */
    ctx.fillStyle='#ff0';
    player.bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

    /* --- Asteroids (simple circles) --- */
    ctx.fillStyle='#888';
    enemies.forEach(e=>{
      ctx.beginPath();
      ctx.arc(e.x+e.w/2, e.y+e.h/2, Math.max(e.w,e.h)/3, 0, Math.PI*2);
      ctx.fill();
    });

    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff';
      ctx.font='48px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2-20);
      ctx.font='24px sans-serif';
      ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2+20);
    }
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
